name: ETH Daily Bot
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python bot.py
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto log update"
          file_pattern: eth_paper.csv
